<text x="700" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#202124">☁️ GOOGLE DRIVE</text>
<text x="700" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#202124">Google Workspace Reporting</text>
<text x="70" y="150" font-family="Arial, sans-serif" font-size="21" fill="#202124" textLength="1260" lengthAdjust="spacing">For the midtermS, we explored the different tools available under Google Workspace.</text>
<text x="70" y="184" font-family="Arial, sans-serif" font-size="21" fill="#202124" textLength="1260" lengthAdjust="spacing">My assigned tool was Google Drive.</text>
<text x="70" y="228" font-family="Arial, sans-serif" font-size="21" fill="#202124" textLength="1260" lengthAdjust="spacing">Through this activity, I explored how Google Drive can be used to store, organize, access,</text>
<text x="70" y="262" font-family="Arial, sans-serif" font-size="21" fill="#202124" textLength="1260" lengthAdjust="spacing">share, and collaborate on digital files.</text>
