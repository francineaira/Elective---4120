<text x="700" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#202124">☁️ GOOGLE DRIVE</text>
<text x="700" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#202124">Google Workspace Reporting</text>
<text x="70" y="158" font-family="Arial, sans-serif" font-size="24" fill="#202124" textLength="1260" lengthAdjust="spacingAndGlyphs">For the midtermS, we explored the different tools available under Google Workspace.</text>
<text x="70" y="196" font-family="Arial, sans-serif" font-size="24" fill="#202124" textLength="1260" lengthAdjust="spacingAndGlyphs">My assigned tool was Google Drive.</text>
<text x="70" y="244" font-family="Arial, sans-serif" font-size="24" fill="#202124" textLength="1260" lengthAdjust="spacingAndGlyphs">Through this activity, I explored how Google Drive can be used to store, organize, access,</text>
<text x="70" y="282" font-family="Arial, sans-serif" font-size="24" fill="#202124" textLength="1260" lengthAdjust="spacingAndGlyphs">share, and collaborate on digital files.</text>
